version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:0.5.1-pg16
    container_name: ai-sdlc-postgres
    environment:
      POSTGRES_USER: sdlc_user
      POSTGRES_PASSWORD: sdlc_password
      POSTGRES_DB: ai_sdlc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdlc_user -d ai_sdlc_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-sdlc-network

  redis:
    image: redis:7-alpine
    container_name: ai-sdlc-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-sdlc-network

volumes:
  postgres_data:
    driver: local

networks:
  ai-sdlc-network:
    driver: bridge
